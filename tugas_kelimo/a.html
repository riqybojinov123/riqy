<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

        <title>Nggolek i Akun Github e Wong</title>
        <link rel="stylesheet" href="./b.css">
    </head>

    <body>
        <div class="countainer">
            <h1>Nggolek Akun E Ndek kene</h1>
            <p>Ketik jeneng akun e ndek kotak nisor iki</p>

            <!--form gae lek arep nggae formulir pencarian-->
            <form id="searchForm">

            <!--input gae ngelebokne username-->
             <input
             type   ="ketikan"
             id     ="jenenge"
             placeholder="Ketik jeneng akun e ndek kene"
             required>

            <!--button gae ngelakokne pencarian-->
             <button type="submit">
                Golek Saiki
             </button>   
            </form>

            <!--id="ngenteni" gae nampilke status loading-->
            <p id="ngenteni">Sek Lagi Digolekke...</p>

            <!--id="NdekKene" gae nggon nampilke profil-->
            <div id="NdekKene"></div>

            <!--id="ndak nemu" gae nampilne pesan seng salah-->
            <p id="Ndak Nemu"></p>
        </div>
        <script src="./c.js"></script>
    </body>
</html>
